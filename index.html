<!-- 초기 테마 적용 : 화면 깜빡임 방지 -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("pmate-theme");

      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      if (t === "dark") {
        document.documentElement.classList.add("dark");
      }

      document.documentElement.style.colorScheme = t;
    } catch (e) {}
  })();
</script>
